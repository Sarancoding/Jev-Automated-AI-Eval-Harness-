services:
  backend:
    build:
      context: .
      dockerfile: webapp/backend/Dockerfile
    ports: ["8000:8000"]
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - JEV_JWT_SECRET=${JEV_JWT_SECRET:-change-me-in-production}
    volumes: ["./webapp/backend/state:/app/webapp/backend/state"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/status')"]
      interval: 10s
      retries: 5
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes: ["./webapp/frontend:/app"]
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    depends_on: [backend]
